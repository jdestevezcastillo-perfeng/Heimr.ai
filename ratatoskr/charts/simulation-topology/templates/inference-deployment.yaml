{{- range .Values.inference }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    type: sim-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
        type: sim-inference
    spec:
      containers:
        - name: app
          image: "{{ $.Values.global.imageRegistry }}/sim-inference:latest"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8000
          resources:
            limits:
              {{- if .gpu }}
              nvidia.com/gpu: 1
              {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  selector:
    app: {{ .name }}
  ports:
    - port: 8000
      targetPort: 8000
{{- end }}
