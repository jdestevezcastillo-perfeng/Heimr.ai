[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heimr-ai"
version = "0.2.0"
description = "Autonomous performance engineering agent for CI/CD pipelines"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Juan Estevez Castillo", email = "jd.estevezcastillo@gmail.com" },
]
keywords = [
  "load-testing",
  "performance",
  "ai-agent",
  "mcp",
  "github-actions",
  "deployment-gate",
  "jmeter",
  "k6",
  "gatling",
  "locust",
  "anomaly-detection",
  "root-cause-analysis",
  "llm",
  "prometheus",
  "observability",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Monitoring",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.21.0",
  "openai>=1.0.0",
  "pandas>=1.5.0",
  "pyyaml>=6.0",
  "requests>=2.28.0",
]

[project.urls]
Homepage = "https://heimr.ai"
Documentation = "https://github.com/jdestevezcastillo-perfeng/Heimr.ai/blob/main/docs/WIKI.md"
"Bug Tracker" = "https://github.com/jdestevezcastillo-perfeng/Heimr.ai/issues"
"Source Code" = "https://github.com/jdestevezcastillo-perfeng/Heimr.ai"

[project.scripts]
heimr = "heimr.cli:main"

[project.optional-dependencies]
openai = [
  "openai>=1.0.0",
]
anthropic = [
  "anthropic>=0.18.0",
]
llm = [
  "openai>=1.0.0",
  "anthropic>=0.18.0",
]
reports = [
  "kaleido>=0.2.1",
  "markdown>=3.4.0",
  "plotly>=5.18.0",
  "weasyprint>=57.0",
]
web = [
  "fastapi>=0.110.0",
  "pydantic>=2.0.0",
]
mcp = [
  "mcp>=1.0.0",
]
all = [
  "anthropic>=0.18.0",
  "fastapi>=0.110.0",
  "kaleido>=0.2.1",
  "markdown>=3.4.0",
  "mcp>=1.0.0",
  "openai>=1.0.0",
  "plotly>=5.18.0",
  "pydantic>=2.0.0",
  "weasyprint>=57.0",
]
dev = [
  "black>=23.0.0",
  "flake8>=6.0.0",
  "isort>=5.12.0",
  "mypy>=1.0.0",
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
]
docs = [
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = [
  "LOCAL",
  "LOCAL.*",
  "demos",
  "demos.*",
  "load-tests",
  "load-tests.*",
  "scripts",
  "scripts.*",
  "tests",
  "tests.*",
  "website",
  "website.*",
]
