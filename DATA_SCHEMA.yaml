version: "1.0.0"
last_updated: "2025-12-01T04:05:00+01:00"
description: "Definition of the training data schema, metrics, and labels."

schema:
  training_example:
    description: "A single row in the Parquet dataset representing a time window of system behavior."
    fields:
      - name: "id"
        type: "string"
        description: "Unique identifier for the example"
      - name: "timestamp"
        type: "timestamp"
        description: "Time of data collection"
      - name: "scenario"
        type: "string"
        description: "Name of the chaos scenario executed (e.g., 'latency_spike')"
      - name: "duration_seconds"
        type: "integer"
        description: "Duration of the data collection window"
      - name: "metrics"
        type: "object"
        ref: "AggregatedMetrics"
      - name: "labels"
        type: "object"
        ref: "TrainingLabels"

  aggregated_metrics:
    description: "Statistical aggregation of raw metrics over the time window."
    fields:
      # Request Rate
      - name: "request_rate_mean"
        type: "float"
      - name: "request_rate_std"
        type: "float"
      - name: "request_rate_min"
        type: "float"
      - name: "request_rate_max"
        type: "float"
      
      # Latency (Seconds)
      - name: "p50_latency_mean"
        type: "float"
      - name: "p50_latency_std"
        type: "float"
      - name: "p95_latency_mean"
        type: "float"
      - name: "p95_latency_std"
        type: "float"
      - name: "p99_latency_mean"
        type: "float"
      - name: "p99_latency_std"
        type: "float"
      - name: "p99_latency_max"
        type: "float"
      
      # Error Rates
      - name: "error_rate_mean"
        type: "float"
      - name: "error_rate_std"
        type: "float"
      - name: "error_rate_max"
        type: "float"
      
      # Resources
      - name: "concurrent_requests_mean"
        type: "float"
      - name: "concurrent_requests_max"
        type: "float"

      # Logs
      - name: "log_total_count"
        type: "integer"
      - name: "log_error_count"
        type: "integer"
      - name: "log_exception_count"
        type: "integer"
      - name: "log_unique_errors"
        type: "integer"
      - name: "log_error_rate"
        type: "float"
      - name: "log_error_samples"
        type: "list[string]"
      - name: "log_warning_samples"
        type: "list[string]"
      - name: "log_context"
        type: "list[string]"

      # Traces
      - name: "trace_count"
        type: "integer"
      - name: "trace_span_count"
        type: "integer"
      - name: "trace_error_spans"
        type: "integer"
      - name: "trace_max_duration_ms"
        type: "float"
      - name: "trace_avg_duration_ms"
        type: "float"
      - name: "trace_p95_duration_ms"
        type: "float"
      - name: "trace_error_rate"
        type: "float"
      - name: "trace_dependencies"
        type: "list[string]"
      - name: "trace_slowest_json"
        type: "object"
      - name: "trace_error_json"
        type: "object"

  training_labels:
    description: "Ground truth labels for supervised learning."
    fields:
      - name: "has_bottleneck"
        type: "boolean"
        description: "True if the system is in a degraded state"
      - name: "bottleneck_type"
        type: "enum"
        values:
          - "healthy"
          - "latency_spike"
          - "latency_bimodal"
          - "latency_degradation"
          - "error_spike"
          - "error_intermittent"
          - "rate_limit"
          - "resource_exhaustion"
          - "cpu_bound"
          - "cascade_failure"
      - name: "severity"
        type: "enum"
        values: ["none", "low", "medium", "high", "critical"]
      - name: "root_cause"
        type: "string"
        description: "Human-readable explanation of the root cause"
      - name: "recommendations"
        type: "list[string]"
        description: "List of actionable fixes"

scenarios:
  healthy:
    bottleneck_type: "healthy"
    severity: "none"
  latency_spike:
    bottleneck_type: "latency_spike"
    severity: "high"
  bimodal_latency:
    bottleneck_type: "latency_bimodal"
    severity: "medium"
  gradual_degradation:
    bottleneck_type: "latency_degradation"
    severity: "high"
  error_spike:
    bottleneck_type: "error_spike"
    severity: "critical"
  intermittent:
    bottleneck_type: "error_intermittent"
    severity: "medium"
  rate_limited:
    bottleneck_type: "rate_limit"
    severity: "medium"
  connection_exhaustion:
    bottleneck_type: "resource_exhaustion"
    severity: "high"
  cpu_bound:
    bottleneck_type: "cpu_bound"
    severity: "high"
  cascade_failure:
    bottleneck_type: "cascade_failure"
    severity: "critical"
