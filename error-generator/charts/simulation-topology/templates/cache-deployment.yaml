{{- range .Values.caches }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    type: sim-cache-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
        type: sim-cache-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        # Main Redis Container
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
        
        # Chaos Sidecar Agent
        - name: chaos-agent
          image: "{{ if $.Values.global.imageRegistry }}{{ $.Values.global.imageRegistry }}/{{ end }}sim-cache-agent:instrumented"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          env:
            - name: REDIS_HOST
              value: "localhost"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  selector:
    app: {{ .name }}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: chaos-api
      port: 8000
      targetPort: 8000
{{- end }}
