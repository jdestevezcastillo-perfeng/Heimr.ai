name: Performance Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  load-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Start Mock Application
        run: |
          nohup python3 mock_server.py > mock.log 2>&1 &
          sleep 3 # Wait for server startup

      - name: Run K6 Load Test
        env:
          BASE_URL: "http://localhost:30808"
        run: |
          k6 run load-tests/k6/ci-load-test.js --out json=results.json
        continue-on-error: true

      - name: Install Heimr
        run: pip install -r requirements.txt

      - name: Analyze Results with Heimr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 heimr/cli.py analyze results.json \
            --format k6 \
            --tag "commit=${GITHUB_SHA}" \
            --tag "branch=${GITHUB_REF_NAME}" \
            --fail-condition "p95_latency > 1000" \
            --fail-condition "error_rate > 1.0" \
            --ci-summary \
            --junit-output heimr-junit.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'heimr-junit.xml'
