name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov
      - name: Run Tests
        run: pytest tests/ -v --ignore=tests/validate_outputs.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install flake8
      - name: Lint (Errors Only)
        run: flake8 heimr/ --count --select=E9,F63,F7,F82 --show-source --statistics

  import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e .
      - name: Verify Core Imports
        run: |
          python -c "from heimr.cli import main; print('CLI OK')"
          python -c "from heimr.parsers.jtl import JTLParser; print('JTL Parser OK')"
          python -c "from heimr.parsers.k6 import K6Parser; print('K6 Parser OK')"
          python -c "from heimr.detector import AnomalyDetector; print('Detector OK')"
          python -c "from heimr.llm import LLMClient; print('LLM OK')"
