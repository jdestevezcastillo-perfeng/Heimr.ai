apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-service-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-service-agent
  template:
    metadata:
      labels:
        app: sim-service-agent
    spec:
      containers:
      - name: sim-service
        image: us-central1-docker.pkg.dev/tokyo-snow-479722-a2/heimr/sim-service-agent:instrumented
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://observability:4317"
        - name: OTEL_SERVICE_NAME
          value: "sim-service-agent"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
