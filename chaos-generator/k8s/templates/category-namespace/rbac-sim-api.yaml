apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-controller-sa
  namespace: sim-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-controller-binding-sim-api
subjects:
  - kind: ServiceAccount
    name: chaos-controller-sa
    namespace: sim-api
roleRef:
  kind: ClusterRole
  name: chaos-controller-role
  apiGroup: rbac.authorization.k8s.io
