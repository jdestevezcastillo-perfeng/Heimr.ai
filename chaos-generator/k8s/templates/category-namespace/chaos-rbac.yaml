apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-controller-sa
  namespace: sim-api

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-controller-role
rules:
- apiGroups: ["heimr.ai"]
  resources: ["chaosscenarios"]
  verbs: ["create", "list", "watch", "get", "delete", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "services", "events", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-controller-binding
subjects:
- kind: ServiceAccount
  name: chaos-controller-sa
  namespace: sim-api
- kind: ServiceAccount
  name: chaos-controller-sa
  namespace: sim-api-2
roleRef:
  kind: ClusterRole
  name: chaos-controller-role
  apiGroup: rbac.authorization.k8s.io
