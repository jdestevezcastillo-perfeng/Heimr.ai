# Prometheus configuration
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: 'chaos-generator'
    environment: 'local'

scrape_configs:
  # Chaos Generator service
  - job_name: 'chaos-generator'
    static_configs:
      - targets: ['chaos-generator:8000']
        labels:
          service: 'chaos-generator'
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
