apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-controller-sa
  namespace: sim-api

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-controller-role
rules:
  - apiGroups: ["heimr.ai"]
    resources: ["chaosscenarios"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-controller-binding
subjects:
  - kind: ServiceAccount
    name: chaos-controller-sa
    namespace: sim-api
roleRef:
  kind: ClusterRole
  name: chaos-controller-role
  apiGroup: rbac.authorization.k8s.io
