apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'minikube'
        namespace: 'NAMESPACE_PLACEHOLDER'

    scrape_configs:
      # Application Metrics
      - job_name: 'sim-service-agent'
        static_configs:
        - targets: ['sim-service:8000']
          labels: {component: 'simulator', sim_type: 'service'}
      
      - job_name: 'sim-db'
        static_configs:
        - targets: ['sim-db:8000']
          labels: {component: 'simulator', sim_type: 'database'}
      
      - job_name: 'sim-cache'
        static_configs:
        - targets: ['sim-cache:8000']
          labels: {component: 'simulator', sim_type: 'cache'}
      
      - job_name: 'sim-queue'
        static_configs:
        - targets: ['sim-queue:8000']
          labels: {component: 'simulator', sim_type: 'queue'}
      
      - job_name: 'sim-inference'
        static_configs:
        - targets: ['sim-inference:8000']
          labels: {component: 'simulator', sim_type: 'inference'}
      
      - job_name: 'chaos-controller'
        static_configs:
        - targets: ['chaos-controller:8000']
          labels: {component: 'chaos'}
      
      # System Metrics (Node Exporter)
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        - source_labels: [__address__]
          regex: '([^:]+)(?::\d+)?'
          target_label: __address__
          replacement: '${1}:9100'
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node
        metric_relabel_configs:
        - source_labels: [__name__]
          regex: 'node_(cpu_seconds_total|memory_.*|disk_.*|network_.*|load.*|filesystem_.*)'
          action: keep
      
      # Container Metrics (cAdvisor)
      - job_name: 'kubelet-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node
        metric_relabel_configs:
        - source_labels: [namespace]
          regex: 'NAMESPACE_PLACEHOLDER'
          action: keep
        - source_labels: [__name__]
          regex: 'container_(cpu_.*|memory_.*|network_.*|fs_.*)'
          action: keep
      
      # Kubernetes Metrics
      - job_name: 'kube-state-metrics'
        static_configs:
        - targets: ['prometheus-kube-state-metrics.heimr-core.svc.cluster.local:8080']
        metric_relabel_configs:
        - source_labels: [namespace]
          regex: 'NAMESPACE_PLACEHOLDER'
          action: keep
        - source_labels: [__name__]
          regex: 'kube_(pod_.*|deployment_.*|container_.*|node_.*)'
          action: keep
      
      # Observability Self-Monitoring
      - job_name: 'prometheus'
        static_configs:
        - targets: ['localhost:9090']
          labels: {component: 'observability'}
      
      - job_name: 'loki'
        static_configs:
        - targets: ['localhost:3100']
          labels: {component: 'observability'}
      
      - job_name: 'tempo'
        static_configs:
        - targets: ['localhost:3200']
          labels: {component: 'observability'}
