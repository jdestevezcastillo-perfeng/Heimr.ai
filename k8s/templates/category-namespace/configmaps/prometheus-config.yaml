apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape all simulation pods in the namespace
      - job_name: 'sim-service-agent'
        static_configs:
        - targets: ['sim-service:8000']
      
      - job_name: 'sim-db'
        static_configs:
        - targets: ['sim-db:8000']
      
      - job_name: 'sim-cache'
        static_configs:
        - targets: ['sim-cache:8000']
      
      - job_name: 'sim-queue'
        static_configs:
        - targets: ['sim-queue:8000']
      
      - job_name: 'sim-inference'
        static_configs:
        - targets: ['sim-inference:8000']
      
      - job_name: 'chaos-controller'
        static_configs:
        - targets: ['chaos-controller:8000']
      
      # Scrape Prometheus itself
      - job_name: 'prometheus'
        static_configs:
        - targets: ['localhost:9090']
