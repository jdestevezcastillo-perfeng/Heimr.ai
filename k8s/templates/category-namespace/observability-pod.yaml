apiVersion: v1
kind: Pod
metadata:
  name: observability-stack
  labels:
    app: observability
    component: monitoring
spec:
  containers:
  # Prometheus - Metrics collection
  - name: prometheus
    image: prom/prometheus:v2.48.0
    ports:
    - name: prometheus
      containerPort: 9090
      protocol: TCP
    volumeMounts:
    - name: prometheus-config
      mountPath: /etc/prometheus
    - name: prometheus-data
      mountPath: /prometheus
    args:
    - '--config.file=/etc/prometheus/prometheus.yml'
    - '--storage.tsdb.path=/prometheus'
    - '--storage.tsdb.retention.time=2h'
    - '--web.enable-lifecycle'
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  
  # Loki - Log aggregation
  - name: loki
    image: grafana/loki:2.9.3  
    ports:
    - name: loki-http
      containerPort: 3100
      protocol: TCP
    volumeMounts:
    - name: loki-config
      mountPath: /etc/loki
    - name: loki-data
      mountPath: /loki
    args:
    - '-config.file=/etc/loki/loki-config.yaml'
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  
  # Tempo - Distributed tracing
  - name: tempo
    image: grafana/tempo:2.3.1
    ports:
    - name: tempo-http
      containerPort: 3200
      protocol: TCP
    - name: otlp-grpc
      containerPort: 4317
      protocol: TCP
    - name: otlp-http
      containerPort: 4318
      protocol: TCP
    volumeMounts:
    - name: tempo-config
      mountPath: /etc/tempo
    - name: tempo-data
      mountPath: /var/tempo
    args:
    - '-config.file=/etc/tempo/tempo.yaml'
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  
  # Promtail - Log shipping
  - name: promtail
    image: grafana/promtail:2.9.3
    volumeMounts:
    - name: promtail-config
      mountPath: /etc/promtail
    - name: varlog
      mountPath: /var/log
      readOnly: true
    args:
    - '-config.file=/etc/promtail/promtail-config.yaml'
    resources:
      requests:
        memory: "64Mi"
        cpu: "25m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  
  # OpenTelemetry Collector
  - name: otel-collector
    image: otel/opentelemetry-collector:0.91.0
    ports:
    - name: otlp-grpc-in
      containerPort: 4317
      protocol: TCP
    - name: otlp-http-in
      containerPort: 4318
      protocol: TCP
    - name: metrics
      containerPort: 8888
      protocol: TCP
    volumeMounts:
    - name: otel-config
      mountPath: /etc/otel
    args:
    - '--config=/etc/otel/otel-collector-config.yaml'
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  
  # Grafana - Dashboards
  - name: grafana
    image: grafana/grafana:10.2.2
    ports:
    - name: grafana-http
      containerPort: 3000
      protocol: TCP
    env:
    - name: GF_SECURITY_ADMIN_USER
      value: "admin"
    - name: GF_SECURITY_ADMIN_PASSWORD
      value: "admin"
    - name: GF_USERS_ALLOW_SIGN_UP
      value: "false"
    volumeMounts:
    - name: grafana-datasources
      mountPath: /etc/grafana/provisioning/datasources
    - name: grafana-dashboards-config
      mountPath: /etc/grafana/provisioning/dashboards
    - name: grafana-data
      mountPath: /var/lib/grafana
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  
  volumes:
  - name: prometheus-config
    configMap:
      name: prometheus-config
  - name: prometheus-data
    emptyDir: {}
  - name: loki-config
    configMap:
      name: loki-config
  - name: loki-data
    emptyDir: {}
  - name: tempo-config
    configMap:
      name: tempo-config
  - name: tempo-data
    emptyDir: {}
  - name: promtail-config
    configMap:
      name: promtail-config
  - name: varlog
    emptyDir: {}
  - name: otel-config
    configMap:
      name: otel-collector-config
  - name: grafana-datasources
    configMap:
      name: grafana-datasources
  - name: grafana-dashboards-config
    configMap:
      name: grafana-dashboards-config
  - name: grafana-data
    emptyDir: {}
