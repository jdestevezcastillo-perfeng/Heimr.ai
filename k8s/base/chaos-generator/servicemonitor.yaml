apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chaos-generator
  namespace: heimr-chaos
  labels:
    app: chaos-generator
    component: chaos-generator
    release: prometheus
spec:
  selector:
    matchLabels:
      app: chaos-generator
  namespaceSelector:
    matchNames:
    - heimr-chaos
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
