apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-generator
  namespace: heimr-core
spec:
  schedule: "0 */4 * * *" # Run every 4 hours
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: data-generator-sa
          containers:
            - name: generator
              image: heimr-registry:5000/data-pipeline:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: SCENARIOS_FILE
                  value: "/app/docs/data/failure_scenarios.yaml"
                - name: OUTPUT_DIR
                  value: "/data/training"
                - name: HELM_CHART
                  value: "error-generator/charts/simulation-topology"
              volumeMounts:
                - name: training-data
                  mountPath: /data/training
                - name: scenarios
                  mountPath: /app/docs/data
          restartPolicy: OnFailure
          volumes:
            - name: training-data
              persistentVolumeClaim:
                claimName: training-data-pvc
            - name: scenarios
              configMap:
                name: failure-scenarios
