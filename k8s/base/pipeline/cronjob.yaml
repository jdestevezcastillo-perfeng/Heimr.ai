apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-generator
  namespace: heimr-core
spec:
  schedule: "0 */4 * * *" # Run every 4 hours
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: data-generator-sa
          containers:
            - name: generator
              image: asia-northeast1-docker.pkg.dev/tokyo-snow-479722-a2/heimr/data-pipeline:latest
              imagePullPolicy: Always
              env:
                - name: SCENARIOS_FILE
                  value: "/app/docs/data/failure_scenarios.yaml"
                - name: OUTPUT_DIR
                  value: "/data/training"
                - name: HELM_CHART
                  value: "chaos-generator/charts/simulation-topology"
                - name: PROMETHEUS_URL
                  value: "http://prometheus-kube-prometheus-prometheus:9090"
                - name: LOKI_URL
                  value: "http://loki:3100"
                - name: TEMPO_URL
                  value: "http://tempo:3100"
                - name: BUCKET_NAME
                  value: "heimr-data-tokyo-snow-479722-a2"
              volumeMounts:
                - name: training-data
                  mountPath: /data/training
                - name: scenarios
                  mountPath: /app/docs/data
          restartPolicy: OnFailure
          volumes:
            - name: training-data
              persistentVolumeClaim:
                claimName: training-data-pvc
            - name: scenarios
              configMap:
                name: failure-scenarios
