apiVersion: batch/v1
kind: Job
metadata:
  name: data-gen-parallel
  namespace: heimr-core
spec:
  completions: 20
  parallelism: 20
  completionMode: Indexed
  template:
    spec:
      serviceAccountName: data-generator-sa
      containers:
        - name: generator
          image: us-central1-docker.pkg.dev/tokyo-snow-479722-a2/heimr/data-pipeline:latest
          imagePullPolicy: Always
          env:
            - name: SCENARIOS_FILE
              value: "/app/FAILURE_SCENARIOS.yaml"
            - name: OUTPUT_DIR
              value: "/data/training"
            - name: HELM_CHART
              value: "chaos-generator/charts/simulation-topology"
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus:9090"
            - name: LOKI_URL
              value: "http://loki:3100"
            - name: TEMPO_URL
              value: "http://tempo:3100"
            - name: BUCKET_NAME
              value: "heimr-data-tokyo-snow-479722-a2"
          volumeMounts:
            - name: training-data
              mountPath: /data/training

      restartPolicy: OnFailure
      volumes:
        - name: training-data
          emptyDir: {}

