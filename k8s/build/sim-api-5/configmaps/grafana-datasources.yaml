apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://observability-stack:9090
        uid: prometheus
        isDefault: true
      
      - name: Loki
        type: loki
        access: proxy
        url: http://observability-stack:3100
      
      - name: Tempo
        type: tempo
        access: proxy
        url: http://observability-stack:3200
