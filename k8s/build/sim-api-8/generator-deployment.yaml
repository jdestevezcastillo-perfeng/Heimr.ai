apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-generator
  namespace: sim-api-8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-generator
  template:
    metadata:
      labels:
        app: data-generator
    spec:
      serviceAccountName: chaos-controller-sa # Reusing existing SA for K8s access (applying CRDs)
      containers:
      - name: generator
        image: us-central1-docker.pkg.dev/tokyo-snow-479722-a2/heimr-sim-images/data-generator:latest
        imagePullPolicy: Always
        command: ["python3", "data-pipeline/run_gke_generation.py"]
        args: ["--namespace", "$(NAMESPACE)", "--prometheus-url", "$(PROMETHEUS_URL)"]
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PROMETHEUS_URL
          value: "http://observability:9090"
        - name: BUCKET_NAME
          value: "heimr-data-tokyo-snow-479722-a2"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/var/secrets/google/key.json"
        volumeMounts:
        - name: gcs-credentials
          mountPath: "/var/secrets/google"
          readOnly: true
      volumes:
      - name: gcs-credentials
        secret:
          secretName: gcs-credentials
