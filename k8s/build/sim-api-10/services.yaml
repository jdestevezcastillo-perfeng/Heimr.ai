apiVersion: v1
kind: Service
metadata:
  name: observability
spec:
  type: ClusterIP
  selector:
    app: observability
  ports:
  - name: prometheus
    port: 9090
    targetPort: 9090
  - name: loki
    port: 3100
    targetPort: 3100
  - name: tempo
    port: 3200
    targetPort: 3200
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: LoadBalancer
  selector:
    app: observability
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sim-service
spec:
  type: ClusterIP
  selector:
    app: sim-service-agent
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
